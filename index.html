<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<meta name="theme-color" content="#151B3B">
<title>Church form</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F4F9;--card:#fff;--ink:#161B33;--mut:#666D88;--line:#DDE1EE;--navy:#151B3B;--before:#4457D6;--during:#0E9F85;--after:#D9822B;--bad:#C93B3B;--good:#0E8A5F}
@media(prefers-color-scheme:dark){:root{--bg:#0E1122;--card:#181C33;--ink:#EEF0FA;--mut:#9AA2C2;--line:#2A2F4D;--navy:#0A0D1C;--before:#7C8CFF;--during:#2CC5A5;--after:#F0A24E;--bad:#FF8080;--good:#4BD6A0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top));border-bottom:4px solid var(--c)}
header b{display:block;font-size:1.05rem}header small{opacity:.75}
main{max-width:560px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
h1{margin:0 0 4px;font-size:1.5rem;line-height:1.2}
.intro{color:var(--mut);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:16px}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:5px}label em{color:var(--bad);font-style:normal}
input,select,textarea{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 14px}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--c);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{flex:1;min-width:110px;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600;padding:0 12px}
.chips button.on{background:var(--c);border-color:var(--c);color:#fff}
.ctr{display:flex;gap:8px;align-items:stretch}
.ctr input{text-align:center;font-size:1.5rem;font-weight:700;min-height:56px;flex:1;min-width:0}
.ctr button{width:56px;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:1.5rem;font-weight:700}
.ctr button.p{background:var(--c);border-color:var(--c);color:#fff}
.ctr button.five{width:56px;font-size:1rem}
.ctr button:active{transform:scale(.94)}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px}
.total b{font-size:2rem;line-height:1}
.go{min-height:56px;border:0;border-radius:14px;background:var(--c);color:#fff;font-weight:700;font-size:1.05rem;width:100%}
.go:disabled{opacity:.6}
.err{color:var(--bad);font-weight:600;text-align:center;min-height:1.2em}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.done{text-align:center;padding:36px 18px}
.done .tick{width:72px;height:72px;border-radius:50%;background:var(--c);color:#fff;font-size:2.2rem;display:grid;place-items:center;margin:0 auto 14px}
.done h2{margin:0 0 6px;font-size:1.4rem}.done p{color:var(--mut);margin:0 0 20px}
.done .go{width:auto;padding:0 28px}
.sent{display:inline-block;background:color-mix(in srgb,var(--c) 12%,transparent);border-radius:12px;padding:10px 16px;font-size:.92rem;margin:0 0 18px}
.sum{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 20px;margin-bottom:20px;text-align:left}
.sum b{font-size:1.4rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hd"><b id="ch"></b><small id="ln"></small></header>
<main>
  <h1 id="h"></h1>
  <p class="intro" id="intro"></p>
  <form id="f" class="card" novalidate></form>
  <div id="done" class="card done" hidden></div>
</main>

<script type="application/json" id="boot"><?!= boot ?></script>
<script>
// ─── BACKEND URL CONFIG ───────────────────────────────────────────────────
// Served by Google Apps Script? Leave BACKEND_URL empty. Hosting this file elsewhere (Vercel, Netlify, GitHub Pages...)?
// Paste your Web App /exec address here, and open the form as   forms.html?page=feedback
// (pages: feedback, register, firsttimer, outreach, attendance)

const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbz4LlRyMIflEW30GS0QI-m8FC9Do70B-tT4fI7xw4G9XJY92iYwvOsjYgFXhiaDOns/exec';   // ← paste your GAS /exec URL here (leave empty when deployed in GAS)

const APP = { backendUrl: BACKEND_URL.trim(), inGas: typeof google !== 'undefined' && !!(google.script && google.script.run) };
async function rpc(fn, args) {
  if (APP.inGas) return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...args));
  if (!APP.backendUrl) throw new Error('BACKEND_NOT_SET');
  let res;
  try { res = await fetch(APP.backendUrl, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({fn: fn, args: args}), redirect: 'follow'}); }
  catch (e) { throw new Error('Could not reach the server. Check your internet connection and try again.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('The server sent an unexpected reply. Check BACKEND_URL and that the Web App allows “Anyone”.'); }
  if (!j.ok) throw new Error(j.error || 'Something went wrong. Please try again.');
  return j.data;
}
async function getBoot() {                       // inside Google the server already put the setup data in the page
  try { const t = document.getElementById('boot').textContent.trim(); if (t.charAt(0) === '{') return JSON.parse(t); } catch (e) {}
  if (!APP.inGas && !APP.backendUrl) throw new Error('BACKEND_NOT_SET');
  return rpc('getPublicBoot', [new URLSearchParams(location.search).get('page') || '']);
}
function problem(e) {
  const m = (e && e.message) || '';
  document.querySelector('main').innerHTML = '<div class="card done"><h2>This form is not available</h2><p>' + (m === 'BACKEND_NOT_SET'
    ? 'It has not been connected yet. Open <b>Forms.html</b> and paste your Apps Script Web App link into <code>BACKEND_URL</code>.'
    : /Unknown form/.test(m) ? 'Check the link. It should end in <code>?page=feedback</code>, <code>register</code>, <code>firsttimer</code>, <code>outreach</code> or <code>attendance</code>.'
    : m.replace(/</g, '&lt;')) + '</p></div>';
}

function run(B) {
(function applyTheme(t) {
  t = Object.assign({navy: '#151B3B', before: '#4457D6', during: '#0E9F85', after: '#D9822B'}, t || {});
  const hx = c => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)), mix = (a, b, k) => { const x = hx(a), y = hx(b); return '#' + x.map((v, i) => ('0' + Math.round(v + (y[i] - v) * k).toString(16)).slice(-2)).join(''); };
  const L = c => mix(c, '#ffffff', .3), D = c => mix(c, '#000000', .4), el = document.createElement('style');
  el.textContent = `:root{--navy:${t.navy};--before:${t.before};--during:${t.during};--after:${t.after}}@media(prefers-color-scheme:dark){:root{--navy:${D(t.navy)};--before:${L(t.before)};--during:${L(t.during)};--after:${L(t.after)}}}`;
  document.head.appendChild(el);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t.navy;
})(B.theme);
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get: k => { try { return localStorage.getItem('cl_' + k) || ''; } catch (e) { return ''; } }, set: (k, v) => { try { localStorage.setItem('cl_' + k, v); } catch (e) {} }};
const nm = n => Number(n || 0).toLocaleString();

const PG = {
  feedback: {color: '--after', fn: 'submitFeedback', btn: 'Send feedback', title: 'Share your feedback',
    intro: 'Tell us how we did. Your feedback helps us serve you better.',
    fields: [
      {k: 'type', l: 'What would you like to share?', t: 'chips', o: [['Feedback', 'Feedback'], ['Suggestion', 'Suggestion']], v: 'Feedback'},
      {k: 'area', l: 'What is it about?', t: 'select', o: B.lists.fbArea},
      {k: 'desc', l: 'Your message', t: 'long', req: 1, ph: 'What went well? What can we improve?'},
      {k: 'name', l: 'Your name (optional)', t: 'text'},
      {k: 'phone', l: 'Phone number (optional)', t: 'tel'},
      {k: 'email', l: 'Email address (optional)', t: 'email'}]},
  register: {color: '--during', fn: 'submitRegistration', btn: 'Register', title: 'Welcome! Please register',
    intro: 'We are glad you are here. Tell us a little about yourself so we can follow up with you.',
    fields: [
      {k: 'service', l: 'Which service are you attending?', t: 'select', o: B.services, req: 1, v: LS.get('svc')},
      {k: 'name', l: 'Full name', t: 'text', req: 1},
      {k: 'phone', l: 'Phone / WhatsApp number', t: 'tel', req: 1},
      {k: 'email', l: 'Email address', t: 'email', req: 1},
      {k: 'vtype', l: 'Have you been here before?', t: 'chips', o: [['First-time', 'First visit'], ['Returning', 'I have been before']], v: 'First-time'},
      {k: 'gender', l: 'Gender', t: 'chips', o: B.lists.gender.map(g => [g, g])},
      {k: 'area', l: 'Area / address (optional)', t: 'text'},
      {k: 'heard', l: 'How did you hear about us?', t: 'select', o: B.lists.heard},
      {k: 'invitedBy', l: 'Who invited you? (optional)', t: 'text'},
      {k: 'interest', l: 'How can we help you?', t: 'select', o: B.lists.interest},
      {k: 'request', l: 'Prayer request or anything else (optional)', t: 'long'}]},
  firsttimer: {color: '--during', fn: 'submitFirstTimer', btn: 'Submit my details', title: 'First-timer card',
    intro: 'Welcome! Please tell us a little about yourself so we can pray for you, keep in touch and help you feel at home.',
    fields: [
      {k: 'service', l: 'Which service are you attending?', t: 'select', o: B.services, req: 1, v: LS.get('svc')},
      {k: 'name', l: 'Full name', t: 'text', req: 1},
      {k: 'gender', l: 'Gender', t: 'chips', o: B.lists.gender.map(g => [g, g])},
      {k: 'dob', l: 'Date of birth (optional)', t: 'date'},
      {k: 'marital', l: 'Marital status', t: 'select', o: B.lists.marital},
      {k: 'phone', l: 'Phone / WhatsApp number', t: 'tel', req: 1},
      {k: 'email', l: 'Email address', t: 'email', req: 1},
      {k: 'area', l: 'Home area / address', t: 'text'},
      {k: 'occupation', l: 'Occupation (optional)', t: 'text'},
      {k: 'heard', l: 'How did you hear about us?', t: 'select', o: B.lists.heard},
      {k: 'invitedBy', l: 'Who invited you? (optional)', t: 'text'},
      {k: 'interest', l: 'How can we help you?', t: 'select', o: B.lists.interest},
      {k: 'prefer', l: 'How would you like us to reach you?', t: 'chips', o: B.lists.contactPref.map(g => [g, g])},
      {k: 'request', l: 'Prayer request or anything else (optional)', t: 'long'}]},
  outreach: {color: '--after', fn: 'submitOutreach', btn: 'Save this person', title: 'Outreach data collection',
    intro: 'For outreach team members. Record each person you meet so the follow-up team can reach them. A phone number or an email is needed.',
    fields: [
      {k: 'by', l: 'Your name (team member)', t: 'text', req: 1, v: LS.get('by')},
      {k: 'activity', l: 'Outreach activity', t: 'select', o: [...B.activities, 'Other / not listed'], req: 1, v: LS.get('act')},
      {k: 'name', l: 'Name of the person you met', t: 'text', req: 1},
      {k: 'phone', l: 'Their phone / WhatsApp (phone or email required)', t: 'tel'},
      {k: 'email', l: 'Their email address (phone or email required)', t: 'email'},
      {k: 'gender', l: 'Gender', t: 'chips', o: B.lists.gender.map(g => [g, g])},
      {k: 'ageGroup', l: 'Age group', t: 'select', o: B.lists.ageGroup},
      {k: 'area', l: 'Area / address (optional)', t: 'text'},
      {k: 'response', l: 'Their response / need', t: 'select', o: B.lists.outreachResponse, req: 1},
      {k: 'notes', l: 'Notes (optional)', t: 'long', ph: 'Prayer request, best time to call, anything useful for follow-up'}]},
  attendance: {color: '--before', fn: 'submitAttendance', btn: 'Submit count', title: 'Service attendance',
    intro: 'For ushers. Count your section or door and submit. Several ushers can submit for the same service and the totals are added together.',
    fields: [
      ...(B.needCode ? [{k: 'code', l: 'Usher code', t: 'password', req: 1, v: LS.get('code')}] : []),
      {k: 'service', l: 'Service / programme', t: 'select', o: B.services, req: 1, v: LS.get('svc')},
      {k: 'date', l: 'Date', t: 'date', v: B.today},
      {k: 'section', l: 'Your section / door (optional)', t: 'text', ph: 'e.g. Main hall, Gate A'},
      {k: 'men', l: 'Men', t: 'ctr'}, {k: 'women', l: 'Women', t: 'ctr'}, {k: 'youth', l: 'Youth', t: 'ctr'}, {k: 'children', l: 'Children', t: 'ctr'},
      {t: 'total'},
      {k: 'workers', l: 'Workers on duty in your section', t: 'ctr'},
      {k: 'by', l: 'Your name', t: 'text', req: 1, v: LS.get('by')},
      {k: 'byPhone', l: 'Your phone number', t: 'tel', req: 1, v: LS.get('byPhone')},
      {k: 'byEmail', l: 'Your email address (optional)', t: 'email', v: LS.get('byEmail')},
      {k: 'notes', l: 'Notes (optional)', t: 'long'}]}
};
const P = PG[B.page], F = $('#f');
document.documentElement.style.setProperty('--c', `var(${P.color})`);
document.title = P.title; $('#ch').textContent = B.church; $('#ln').textContent = B.launch;
$('#h').textContent = P.title; $('#intro').textContent = P.intro;
const val = {};

function build() {
  F.innerHTML = P.fields.map(f => {
    if (f.t === 'total') return '<div class="total"><span>Total counted</span><b id="tot">0</b></div>';
    const lab = `<label for="i_${f.k}">${esc(f.l)}${f.req ? ' <em>*</em>' : ''}</label>`, id = `id="i_${f.k}" name="${f.k}"`;
    let inp;
    if (f.t === 'select') inp = `<select ${id}><option value="">Select…</option>${f.o.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
    else if (f.t === 'long') inp = `<textarea ${id} placeholder="${esc(f.ph || '')}"></textarea>`;
    else if (f.t === 'chips') inp = `<div class="chips" data-chips="${f.k}">${f.o.map(o => `<button type="button" data-v="${esc(o[0])}">${esc(o[1])}</button>`).join('')}</div>`;
    else if (f.t === 'ctr') inp = `<div class="ctr" data-ctr><button type="button" data-s="-1" aria-label="Minus one">−</button><input ${id} type="number" inputmode="numeric" min="0" value="0"><button type="button" class="p" data-s="1" aria-label="Plus one">+</button><button type="button" class="p five" data-s="5" aria-label="Plus five">+5</button></div>`;
    else inp = `<input ${id} type="${f.t}" ${f.t === 'tel' ? 'inputmode="tel"' : ''} placeholder="${esc(f.ph || '')}" autocomplete="${f.t === 'password' ? 'off' : f.k === 'name' ? 'name' : f.t === 'tel' ? 'tel' : f.t === 'email' ? 'email' : 'off'}">`;
    return `<div>${lab}${inp}</div>`;
  }).join('') + '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true"><div class="err" id="err" role="alert"></div><button class="go" id="go" type="submit">' + esc(P.btn) + '</button>';
  P.fields.forEach(f => {
    if (!f.k) return;
    const el = F.elements[f.k];
    if (f.t === 'chips') { val[f.k] = f.v || ''; paint(f.k); }
    else if (el && f.v) el.value = f.v;
  });
}
function paint(k) { F.querySelectorAll(`[data-chips="${k}"] button`).forEach(b => b.classList.toggle('on', b.dataset.v === val[k])); }
function total() { const t = ['men', 'women', 'youth', 'children'].reduce((a, k) => a + (+F.elements[k].value || 0), 0); const e = $('#tot'); if (e) e.textContent = nm(t); return t; }

F.addEventListener('click', e => {
  const c = e.target.closest('[data-chips] button');
  if (c) { const k = c.parentNode.dataset.chips; val[k] = val[k] === c.dataset.v && k !== 'type' && k !== 'vtype' ? '' : c.dataset.v; paint(k); return; }
  const s = e.target.closest('[data-s]');
  if (s) { const i = s.parentNode.querySelector('input'); i.value = Math.max(0, (+i.value || 0) + (+s.dataset.s)); total(); if (navigator.vibrate) navigator.vibrate(8); }
});
F.addEventListener('input', () => { if (B.page === 'attendance') total(); });

F.addEventListener('submit', e => {
  e.preventDefault();
  const err = $('#err'), go = $('#go'); err.textContent = '';
  const d = {website: F.elements.website.value};
  P.fields.forEach(f => { if (f.k) d[f.k] = f.t === 'chips' ? val[f.k] : F.elements[f.k].value.trim(); });
  const miss = P.fields.find(f => f.req && !String(d[f.k]).trim());
  if (miss) { err.textContent = 'Please fill in: ' + miss.l.replace(/ \(.*/, ''); F.elements[miss.k].focus(); return; }
  const bad = P.fields.find(f => d[f.k] && ((f.t === 'tel' && String(d[f.k]).replace(/\D/g, '').length < 7) || (f.t === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d[f.k]))));
  if (bad) { err.textContent = 'Please enter a valid ' + (bad.t === 'tel' ? 'phone number' : 'email address') + '.'; F.elements[bad.k].focus(); return; }
  if (B.page === 'outreach' && !d.phone && !d.email) { err.textContent = 'Please enter a phone number or an email.'; F.elements.phone.focus(); return; }
  if (B.page === 'attendance' && !total()) { err.textContent = 'Tap + to count at least one person.'; return; }
  go.disabled = true; go.textContent = 'Sending…';
  rpc(P.fn, [d]).then(r => finish(r, d), x => {
    go.disabled = false; go.textContent = P.btn;
    err.textContent = ((x && x.message) || 'Could not send. Check your connection and try again.').replace(/^Error: /, '');
  });
});

function finish(r, d) {
  if (d.service) LS.set('svc', d.service);
  if (B.page === 'outreach') { LS.set('by', d.by); LS.set('act', d.activity); }
  if (B.page === 'attendance') { LS.set('by', d.by); LS.set('byPhone', d.byPhone); LS.set('byEmail', d.byEmail); if (d.code) LS.set('code', d.code); }
  let t, p, extra = '', again;
  if (B.page === 'feedback') { t = 'Thank you!'; p = 'Your feedback has been received. God bless you.'; again = 'Send another'; }
  else if (B.page === 'outreach') {
    const n = esc((d.name || '').split(' ')[0]);
    t = r.dup ? 'Already recorded' : 'Saved ✓'; p = r.dup ? n + ' was already recorded today for this activity.' : n + ' has been added for follow-up. Thank you for your work.'; again = 'Add another person';
    extra = `<div class="sum">You have recorded <b>${nm(r.count)}</b> ${r.count === 1 ? 'person' : 'people'} today for this activity</div><br>`;
  } else if (B.page === 'register' || B.page === 'firsttimer') {
    const n = esc((r.name || '').split(' ')[0]);
    t = r.dup ? 'Welcome back' + (n ? ', ' + n : '') + '!' : 'Welcome' + (n ? ', ' + n : '') + '!';
    p = r.dup ? 'You are already registered for today. Enjoy the service.' : 'You are registered. Our team will reach out to you soon. We are glad you are here.'; again = B.page === 'firsttimer' ? 'Add another first-timer' : 'Register another person';
  } else {
    t = 'Count recorded'; p = 'Thank you, ' + esc(d.by.split(' ')[0]) + '.'; again = 'Add another count';
    extra = `<div class="sum">You counted <b>${nm(r.count)}</b><br>Total so far for ${esc(r.service)}: <b>${nm(r.serviceTotal)}</b> from ${r.counts} count${r.counts === 1 ? '' : 's'}</div><br>`;
  }
  const to = d.email || d.byEmail, mailNote = r.mailed && to ? `<div class="sent">✉️ ${B.page === 'outreach' ? 'A thank-you message was emailed to' : 'A confirmation was emailed to'} <b>${esc(to)}</b></div><br>` : '';
  F.hidden = true; const D = $('#done'); D.hidden = false;
  D.innerHTML = `<div class="tick">✓</div><h2>${t}</h2><p>${p}</p>${mailNote}${extra}<button class="go" id="again">${again}</button>`;
  window.scrollTo(0, 0);
  $('#again').onclick = () => { D.hidden = true; F.hidden = false; build(); ['service', 'by', 'activity', 'byPhone', 'byEmail', 'code', 'date'].forEach(k => { if (F.elements[k] && d[k]) F.elements[k].value = d[k]; }); if (B.page === 'attendance') total(); window.scrollTo(0, 0); };
}
build();
}
getBoot().then(run).catch(problem);
</script>
</body>
</html>
